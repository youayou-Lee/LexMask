# LexMask docker compose
#
# CPU API/frontend only:
#   docker compose up -d
#
# Full GPU model stack (unchanged behavior; Issue#217 local presets use
# start_local.sh which selects finer-grained profiles):
#   docker compose --profile gpu up -d
#
# Model-service profiles (Issue#217): `ner` / `ocr-gpu` / `visual` can be
# enabled independently; every model service also stays in the legacy `gpu`
# profile so the existing one-command stack is untouched.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /app
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - path: ${BACKEND_ENV_FILE:-.env}
        required: false
    # Issue#217: model-service addresses are overridable so `start_local.sh
    # --ocr cloud` style presets can point them at an SSH-tunneled instance.
    # Defaults keep the in-network service names (behavior identical to before).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DEBUG=${DEBUG:-false}
      - DATA_DIR=/app/data
      - UPLOAD_DIR=/app/uploads
      - OUTPUT_DIR=/app/outputs
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
      - VIRUS_SCAN_ENABLED=${VIRUS_SCAN_ENABLED:-false}
      - OCR_REQUIRE_GPU=${OCR_REQUIRE_GPU:-false}
      - JOB_CONCURRENCY=${JOB_CONCURRENCY:-3}
      - BATCH_RECOGNITION_PAGE_CONCURRENCY=${BATCH_RECOGNITION_PAGE_CONCURRENCY:-1}
      - HAS_NER_MAX_PARALLEL_REQUESTS=${HAS_NER_MAX_PARALLEL_REQUESTS:-8}
      - HAS_NER_GLOBAL_MAX_INFLIGHT=${HAS_NER_GLOBAL_MAX_INFLIGHT:-8}
      - HAS_NER_VERIFY_PARALLEL_CAP=${HAS_NER_VERIFY_PARALLEL_CAP:-8}
      - VISUAL_FEATURES_CONCURRENCY=${VISUAL_FEATURES_CONCURRENCY:-1}
      - VISION_DUAL_PIPELINE_PARALLEL=${VISION_DUAL_PIPELINE_PARALLEL:-false}
      - OCR_BASE_URL=${OCR_BASE_URL:-http://ocr:8082}
      - HAS_TEXT_RUNTIME=${HAS_TEXT_RUNTIME:-vllm}
      - HAS_TEXT_VLLM_BASE_URL=${HAS_TEXT_VLLM_BASE_URL:-http://ner:8080/v1}
      - HAS_TEXT_MODEL_NAME=${HAS_TEXT_MODEL_NAME:-HaS_Text_0209_0.6B}
      - VISUAL_FEATURES_BASE_URL=${VISUAL_FEATURES_BASE_URL:-http://visual-features:8090}
      # Issue#217 PR③：MinerU 喂料地址（mineru profile 起容器名；云端档走隧道）
      - MINERU_API_BASE_URL=${MINERU_API_BASE_URL:-http://mineru:16581}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:${FRONTEND_PORT:-3000}","http://127.0.0.1:${FRONTEND_PORT:-3000}"]}
    volumes:
      - backend-data:/app/data
      - backend-uploads:/app/uploads
      - backend-outputs:/app/outputs
      # Issue#217: .doc conversion (soffice) is provided by the HOST, not baked
      # into the image — requires libreoffice-writer-nogui on the host.
      - /usr/lib/libreoffice:/usr/lib/libreoffice:ro
      - /usr/bin/soffice:/usr/bin/soffice:ro
      - /etc/libreoffice:/etc/libreoffice:ro
    networks:
      - redaction-net
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    # Issue #29：nginx client_max_body_size 与后端 MAX_FILE_SIZE 同源联动。
    # MAX_FILE_SIZE 传入前端容器后，由镜像内 entrypoint 脚本换算成
    # client_max_body_size（0=不限；N 字节 → N+8MB multipart 开销，向上取整 MB）。
    # 需要精细控制时可直接设 NGINX_CLIENT_MAX_BODY_SIZE（nginx 尺寸语法）。
    environment:
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-0}
      - NGINX_CLIENT_MAX_BODY_SIZE=${NGINX_CLIENT_MAX_BODY_SIZE:-}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - redaction-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  ocr:
    build:
      context: ./backend
      dockerfile: Dockerfile.ocr
    # Issue#217: run the script directly — init_ocr() only executes under
    # `__main__`; a bare `uvicorn ocr_server:app` never initializes paddle
    # (every endpoint stays 503 with ready:false). Same form as the
    # cloud-deploy venv line.
    command: ["python3", "ocr_server.py"]
    environment:
      # Same flags as cloud-deploy/start_cloud.sh's OCR line: structure-first
      # mode (/structure is the primary path; without OCR_STRUCTURE_ENABLED=1
      # the route is not even registered and ocr_has gets 404 → 0 blocks).
      - OCR_VL_ENABLED=0
      - OCR_STRUCTURE_ENABLED=1
      - OCR_STRUCTURE_PRIMARY=1
      - OCR_STRUCTURE_WARMUP=1
      - OCR_STRUCTURE_RELEASE_AFTER_REQUEST=0
      - OCR_MAX_IMAGE_SIDE=2048
      - OCR_MAX_NEW_TOKENS=2048
      - PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK=True
    ports:
      - "${OCR_PORT:-8082}:8082"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - redaction-net
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8082/health').raise_for_status()"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    profiles:
      - gpu
      - ocr-gpu
    restart: unless-stopped

  ner:
    # Same runtime and weights as local development (vLLM + HF bf16), so the
    # NER behavior validated locally carries over to Docker unchanged.
    image: vllm/vllm-openai:v0.19.1
    ipc: host
    ports:
      - "${NER_PORT:-8080}:8080"
    volumes:
      - ./backend/models:/models
    command:
      - --model
      - /models/has/HaS_Text_0209_0.6B
      - --served-model-name
      - HaS_Text_0209_0.6B
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --trust-remote-code
      - --dtype
      - bfloat16
      - --max-model-len
      - "4096"
      - --max-num-batched-tokens
      - "4096"
      - --gpu-memory-utilization
      - "0.18"
      - --kv-cache-memory-bytes
      - "671088640"
      - --no-enable-prefix-caching
      - --default-chat-template-kwargs
      - '{"enable_thinking":false}'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - redaction-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    profiles:
      - gpu
      - ner
    restart: unless-stopped

  visual-features:
    build:
      context: ./backend
      dockerfile: Dockerfile.locateanything
    ports:
      - "${VISUAL_FEATURES_PORT:-8090}:8090"
    environment:
      - LOCATE_ANYTHING_MODEL=${LOCATE_ANYTHING_MODEL:-/models/locateanything/LocateAnything-3B-HF}
      - LOCATE_ANYTHING_BACKEND=${LOCATE_ANYTHING_BACKEND:-hf}
      - LOCATE_ANYTHING_DTYPE=${LOCATE_ANYTHING_DTYPE:-bfloat16}
      - LOCATE_ANYTHING_PORT=8090
      - LOCATE_ANYTHING_MAX_IMAGE_SIDE=${LOCATE_ANYTHING_MAX_IMAGE_SIDE:-1280}
      - LOCATE_ANYTHING_SIGNATURE_MAX_IMAGE_SIDE=${LOCATE_ANYTHING_SIGNATURE_MAX_IMAGE_SIDE:-1280}
      - LOCATE_ANYTHING_SIGNATURE_TILE_MAX_IMAGE_SIDE=${LOCATE_ANYTHING_SIGNATURE_TILE_MAX_IMAGE_SIDE:-1280}
      - LOCATE_ANYTHING_MAX_NEW_TOKENS=${LOCATE_ANYTHING_MAX_NEW_TOKENS:-8192}
      - LOCATE_ANYTHING_GENERATION_MODE=${LOCATE_ANYTHING_GENERATION_MODE:-hybrid}
    volumes:
      - ./backend/models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - redaction-net
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8090/health').raise_for_status()"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s
    profiles:
      - gpu
      - visual
    restart: unless-stopped

  mineru:
    # Issue#217 PR③：MinerU 喂料通道（sidecar 容器，GPU 形态）。
    # sidecar 契约与 backend/app/services/mineru_parse_client.py 对齐；
    # 脚本=backend/scripts/mineru_sidecar.py（仓内化，实例侧 #75 底稿缺 → 按契约重写）。
    build:
      context: ./backend
      dockerfile: Dockerfile.mineru
    ports:
      - "${MINERU_PORT:-16581}:16581"
    environment:
      - MINERU_SIDECAR_PORT=16581
      - MINERU_SIDECAR_WORKDIR=/tmp/mineru-sidecar
      - MINERU_MODEL_SOURCE=local
    volumes:
      - mineru-cache:/home/appuser/.paddlex
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - redaction-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:16581/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    profiles:
      - mineru

volumes:
  backend-data:
  backend-uploads:
  backend-outputs:
  mineru-cache:

networks:
  redaction-net:
    driver: bridge
