name: CI

on:
  push:
    branches: [main, preview]
  pull_request:
    branches: [main, preview]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 基底守卫（Issue #62 评审教训：功能分支误基于旧 main 会悄悄回退
  # preview 已验收改动）。落后 preview 的分支直接红灯，不靠人眼抓。
  base-guard:
    name: Base guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # pull_request 事件默认检出 refs/pull/N/merge（head×base 合并提交），
          # 它天然包含 origin/preview，ancestor 检查会恒真放行——必须检出 head 本体
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Feature branches must target preview and include it
        # 分支名经 env 传入而非 ${{ }} 直接插值进 shell——分支名合法字符含
        # " $ ; ` 等，直接插值存在脚本注入面（评审 Issue 1）
        env:
          BASE: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          # fork PR 的 head_ref 只是 fork 侧分支名，须同仓库才认「晋级」（评审 Issue 2）
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          echo "PR base: $BASE, head: $HEAD_REF"
          if [ -z "$BASE" ]; then
            echo "push/workflow_dispatch 触发，跳过守卫"
            exit 0
          fi
          if [ "$BASE" = "main" ]; then
            # main 只收晋级（head=preview，须本仓库分支）与 hotfix（事故教训：
            # PR #58 曾误选 base=main 把功能直接合进 main），其余一律拒绝
            if [ "$HEAD_REF" = "preview" ] && [ "$HEAD_REPO" = "$REPO" ]; then
              # 晋级须含最新 main（Issue #25 B4）：main 被直接合入后若 preview 未同步，
              # 晋级会把 main 已发布改动回退掉
              git fetch origin main --quiet
              if git merge-base --is-ancestor origin/main HEAD; then
                echo "main 晋级 PR：已包含最新 main，放行"
                exit 0
              fi
              echo "::error::晋级 PR 落后 main：先把 main 合入 preview（或 rebase）再晋级，防止回退 main 已发布改动"
              exit 1
            fi
            if [[ "$HEAD_REF" == hotfix/* ]]; then
              echo "hotfix PR：放行"
              exit 0
            fi
            echo "::error::目标 main 的 PR 只允许 preview 晋级或 hotfix/* 分支（当前 head=$HEAD_REF）。功能分支应以 preview 为 base"
            exit 1
          fi
          # 触发器限定 base∈{main,preview}，此分支理论不可达——防御性保留，
          # 若未来放开 pull_request 触发分支则依赖此校验
          if [ "$BASE" != "preview" ]; then
            echo "::error::功能分支必须以 preview 为 base（当前 base=$BASE）"
            exit 1
          fi
          git fetch origin preview --quiet
          if git merge-base --is-ancestor origin/preview HEAD; then
            echo "OK：分支已包含最新 preview"
          else
            echo "::error::分支落后 preview：先执行 git merge origin/preview 再推送（防止合并时回退 preview 已验收改动）"
            exit 1
          fi

  # 公开树红线扫描（G4，Issue#159）。此前只在本地手动跑：规则被放松、或改动面
  # 引入凭据字面量，CI 一句话不说（#140/#141 就是这么漏出去的）。
  public-tree-scan:
    name: Public tree scan (G4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 与 base-guard 同理：pull_request 默认检出 merge 提交，扫描面会变成 head×base 合并结果
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Scanner self-test (planted forms must each be caught)
        run: python3 eval-ng/scripts/check_public_tree.py --self-test

      - name: Scan changed files for red-line traces
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -e
          if [ -n "$BASE" ]; then
            git fetch origin "$BASE" --quiet
            python3 eval-ng/scripts/check_public_tree.py --base "origin/$BASE"
          elif git rev-parse --verify --quiet HEAD~1 >/dev/null; then
            python3 eval-ng/scripts/check_public_tree.py --base HEAD~1
          else
            echo "无可比基线（仓库首个提交），仅跑自检"
          fi

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Issue#157：测试文件此前不在任何 tsc 程序内（tsconfig.json 显式 exclude 了
      # `src/**/*.test.ts(x)`），而 `npm test` 已在 CI 里跑 ⇒ 测试文件的类型错误
      # 在 CI 与本地都是盲区。这里用专用配置把测试一并纳入类型检查、fail-fast。
      # 不改主 tsconfig：引入 `@types/node` 后全局 `setTimeout` 的重载来自它，三处
      # `ReturnType<typeof window.setTimeout>` 声明会被解析成 `NodeJS.Timeout`
      # 而实参仍是 `number` ⇒ 反而让三个产品文件报 TS2322（类型门不该改产品类型面）。
      # 第二行断言「测试文件**一个不少**地进了程序」——地板式 `grep -q`（≥1）挡不住
      # 「只漏一类」的覆盖门静默失效（冷审变异 M-B：只 exclude `*__tests__` / `*.test.tsx`
      # 时仍 rc=0）。故改为与盘上实数做集合计数比对：漏任何一个即判红。
      - name: Type-check tests (Issue#157)
        working-directory: frontend
        run: |
          npx tsc -p tsconfig.test.json
          expected=$(find src -type f \( -name '*.test.ts' -o -name '*.test.tsx' \) | wc -l | tr -d ' ')
          actual=$(npx tsc -p tsconfig.test.json --listFiles | grep -cE 'src/.*\.test\.tsx?$' || true)
          echo "测试文件：盘上 $expected 个，进入 tsc 程序 $actual 个"
          [ "$actual" = "$expected" ] \
            || { echo "::error::测试文件未全部进入 tsconfig.test.json 的程序（盘上 $expected / 程序内 $actual，Issue#157 覆盖门失效）"; exit 1; }

      # Issue#149：Issue#106 的页并发回归判据（`utils.vision-page-concurrency.test.ts`
      # 断言「勾选印章+签名、不传 concurrency 时在飞 vision POST 峰值 = 3」）此前只在本地跑：
      # 常量被改回 1、或重新引入「勾选视觉特征 ⇒ 串行」分支时 CI 全绿、生产静默退回串行。
      # 该用例纯 mock、不依赖后端，实测 <1s，故钉在 build 之前 fail-fast。
      # `--reporter=verbose`：Actions 的步骤非 TTY，vitest 默认 reporter 全绿时只打文件级一行
      # （看不到单条用例名）⇒ 本轮 ③ 冷评审 AC4 判未达成，故显式用 verbose 列出 5 条用例名。
      - name: Frontend page-concurrency guard (Issue#106)
        working-directory: frontend
        run: npx vitest run src/features/playground/utils.vision-page-concurrency.test.ts --reporter=verbose

      # Issue#48：全量前端测试进 CI（原先只 npm ci + build，测试从未在 CI 跑过）。
      # 上面那条是 #106/#149 的定点并发护栏（带 verbose 列出用例名）；
      # 本条跑全量（含同一条护栏），保证新组件用例等以后新增用例都在 CI 里。
      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

  backend:
    name: Backend import and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Lint with ruff
        run: pip install ruff && ruff check app/

      - name: Import FastAPI app
        run: python -c "from app.main import app; print(app.title)"

      - name: Run backend tests
        run: python -m pytest tests -q

  docker-build:
    name: Docker build verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t test-backend -f backend/Dockerfile backend/

      - name: Build frontend image
        run: docker build -t test-frontend -f frontend/Dockerfile frontend/
